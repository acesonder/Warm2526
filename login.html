<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Warming Room</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="login-section" class="section active">
            <div class="login-box">
                <h1>Winter Warming Room</h1>
                <p class="subtitle">Please select your role to continue</p>
                <div class="role-buttons">
                    <button class="role-btn" data-role="client" onclick="selectRole('client')">
                        <span class="icon">👤</span>
                        <span>Client</span>
                    </button>
                    <button class="role-btn" data-role="staff" onclick="selectRole('staff')">
                        <span class="icon">👨‍💼</span>
                        <span>Staff</span>
                    </button>
                    <button class="role-btn" data-role="admin" onclick="selectRole('admin')">
                        <span class="icon">⚙️</span>
                        <span>Administrator</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="section">
            <header class="dashboard-header">
                <h2 id="dashboard-title">Dashboard</h2>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </header>
            
            <div class="dashboard-content">
                <!-- Dynamic content will be loaded here -->
                <div id="dynamic-content" class="content-area">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <footer class="dashboard-footer">
                <p>Winter Warming Room &copy; 2025 | Stay Warm, Stay Safe</p>
            </footer>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
